name: CI Release Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test core and CLI
        run: cargo test -p ghrm-core -p ghrm

      - name: Build Linux CLI
        run: cargo build -p ghrm --release

      - name: Package Linux CLI
        run: |
          mkdir -p artifacts
          cp target/release/ghrm artifacts/ghrm-linux-x64
          chmod +x artifacts/ghrm-linux-x64

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-linux-x64
          path: artifacts/ghrm-linux-x64

  windows-cli:
    name: Windows CLI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test core and CLI
        run: cargo test -p ghrm-core -p ghrm

      - name: Build Windows CLI
        run: cargo build -p ghrm --release

      - name: Package Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/release/ghrm.exe artifacts/ghrm-windows-x64.exe

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-windows-x64
          path: artifacts/ghrm-windows-x64.exe

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop bundle
        run: npm run tauri build

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-desktop-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/ghrm-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - linux-cli
      - windows-cli
      - windows-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: ghrm-linux-x64
          path: release-assets

      - name: Download Windows CLI
        uses: actions/download-artifact@v4
        with:
          name: ghrm-windows-x64
          path: release-assets

      - name: Download Windows desktop bundle
        uses: actions/download-artifact@v4
        with:
          name: ghrm-desktop-windows-x64
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' release_assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${release_assets[@]}"
