name: CI Release Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test core and CLI
        run: cargo test -p releasedock-core -p releasedock-cli

      - name: Build Linux CLI
        run: cargo build -p releasedock-cli --release

      - name: Package Linux CLI
        run: |
          mkdir -p artifacts
          cp target/release/releasedock artifacts/releasedock-linux-x64
          chmod +x artifacts/releasedock-linux-x64

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: releasedock-linux-x64
          path: artifacts/releasedock-linux-x64

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Windows code signing secrets
        id: windows_codesign
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)
          if ($hasCertificate -and $hasPassword) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Windows code signing secrets are configured. Tagged Windows artifacts will be signed."
          } elseif (-not $hasCertificate -and -not $hasPassword) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Windows code signing secrets are not configured. Tagged Windows artifacts will be published unsigned and may trigger SmartScreen unknown-publisher warnings."
          } else {
            throw "Both WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PASSWORD must be configured together."
          }

      - name: Import Windows code signing certificate
        id: import_codesign_cert
        if: startsWith(github.ref, 'refs/tags/v') && steps.windows_codesign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "releasedock-codesign.pfx"
          $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CODESIGN_PFX_BASE64 -replace '\s', ''))
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          $securePassword = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PASSWORD -AsPlainText -Force
          $certificates = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword
          Remove-Item $certificatePath -Force

          $certificate = $certificates |
            Where-Object {
              $_.HasPrivateKey -and (
                $_.EnhancedKeyUsageList.Count -eq 0 -or
                ($_.EnhancedKeyUsageList | Where-Object {
                  $_.ObjectId -eq "1.3.6.1.5.5.7.3.3" -or
                  $_.FriendlyName -eq "Code Signing"
                })
              )
            } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if (-not $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "The PFX did not contain a usable code signing certificate with a private key."
          }
          Write-Host "Using Windows code signing certificate thumbprint $($certificate.Thumbprint), expires $($certificate.NotAfter.ToString('u'))."
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build Tauri desktop bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.windows_codesign.outputs.enabled != 'true' }}
        run: npm run tauri build

      - name: Build signed Tauri desktop bundle
        if: startsWith(github.ref, 'refs/tags/v') && steps.windows_codesign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signingConfig = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
          $thumbprint = "${{ steps.import_codesign_cert.outputs.thumbprint }}"
          $signingConfigData = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $signingConfigData | ConvertTo-Json -Depth 4 | Set-Content -Path $signingConfig -Encoding UTF8
          npm run tauri build -- --config "$signingConfig"

      - name: Rename Windows desktop executable
        shell: pwsh
        run: Copy-Item src-tauri/target/release/releasedock.exe src-tauri/target/release/ReleaseDock-windows-x64.exe

      - name: Verify Windows code signatures
        if: startsWith(github.ref, 'refs/tags/v') && steps.windows_codesign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter signtool.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe was not found in the Windows SDK."
          }

          $nsisArtifacts = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          $msiArtifacts = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          if ($nsisArtifacts.Count -eq 0) {
            throw "No NSIS installer was produced for the tagged Windows release."
          }
          if ($msiArtifacts.Count -eq 0) {
            throw "No MSI installer was produced for the tagged Windows release."
          }

          $artifacts = @(
            "src-tauri/target/release/releasedock.exe",
            "src-tauri/target/release/ReleaseDock-windows-x64.exe"
          )
          $artifacts += $nsisArtifacts | ForEach-Object { $_.FullName }
          $artifacts += $msiArtifacts | ForEach-Object { $_.FullName }

          foreach ($artifact in $artifacts | Sort-Object -Unique) {
            Write-Host "Verifying Windows code signature for $artifact"
            & $signTool.FullName verify /pa /v $artifact
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $artifact."
            }
          }

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: releasedock-windows-x64-desktop
          path: |
            apps/desktop/src-tauri/target/release/ReleaseDock-windows-x64.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Remove Windows code signing certificate
        if: always() && startsWith(github.ref, 'refs/tags/v') && steps.windows_codesign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.import_codesign_cert.outputs.thumbprint }}"
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            Get-ChildItem Cert:\CurrentUser\My |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force
          }

  linux-desktop:
    name: Linux Desktop
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Build Linux desktop bundle
        run: bash ../../scripts/linux/build-desktop.sh --bundles deb,rpm

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: releasedock-linux-x64-desktop
          path: |
            apps/desktop/src-tauri/target/release/releasedock
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - linux-cli
      - linux-desktop
      - windows-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux CLI
        uses: actions/download-artifact@v8.0.1
        with:
          name: releasedock-linux-x64
          path: release-assets

      - name: Download Linux desktop bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: releasedock-linux-x64-desktop
          path: release-assets

      - name: Download Windows desktop bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: releasedock-windows-x64-desktop
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' packaged_assets < <(find release-assets -type f -print0 | sort -z)
          if [ "${#packaged_assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          (
            cd release-assets
            for asset in "${packaged_assets[@]}"; do
              sha256sum "${asset#release-assets/}"
            done > SHA256SUMS
          )

          mapfile -d '' release_assets < <(find release-assets -type f -print0 | sort -z)

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${release_assets[@]}"
