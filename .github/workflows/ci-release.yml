name: CI Release Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-cli:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test core and CLI
        run: cargo test -p ghrm-core -p ghrm

      - name: Build Linux CLI
        run: cargo build -p ghrm --release

      - name: Package Linux CLI
        run: |
          mkdir -p artifacts
          cp target/release/ghrm artifacts/ghrm-linux-x64
          chmod +x artifacts/ghrm-linux-x64

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-linux-x64
          path: artifacts/ghrm-linux-x64

  windows-cli:
    name: Windows CLI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test core and CLI
        run: cargo test -p ghrm-core -p ghrm

      - name: Build Windows CLI
        run: cargo build -p ghrm --release

      - name: Package Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/release/ghrm.exe artifacts/ghrm-windows-x64.exe

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-windows-x64
          path: artifacts/ghrm-windows-x64.exe

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop bundle
        run: npm run tauri build

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghrm-desktop-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            ../../target/release/bundle/nsis/*.exe
            ../../target/release/bundle/msi/*.msi
