[package]
name = "releasedock"
version = "0.2.7"
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tray-icon feature 提供系统托盘支持
tauri = { version = "2", features = ["tray-icon"] }
# time feature 提供 tokio::time::interval 用于后台定时检查
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tauri-plugin-notification = "2"
url = "2"
releasedock-cli = { package = "releasedock-cli", path = "../../../crates/cli" }
releasedock-core = { path = "../../../crates/core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
